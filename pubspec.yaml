name: vitallink
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_messaging: ^16.7.0
  geolocator: ^14.1.1
  geoflutterfire_plus: ^0.0.34
  url_launcher: ^6.3.2
  image_picker: ^1.2.3
  http: ^1.6.0
  intl: ^0.20.2
  go_router: ^17.5.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  flutter_local_notifications: ^19.4.2
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/icons/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
  macos:
    generate: true
  web:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/app_icon.png
